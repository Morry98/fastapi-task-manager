name: Publish

# Never add a pull_request (or pull_request_target) trigger here: this workflow can
# mint an OIDC token for PyPI and write tags/releases. tests/test_workflows.py enforces it.
#
# - push to main: runs the full CI, then publishes official x.y.z versions only.
# - workflow_dispatch: manual run (gated by the `pypi` environment reviewers);
#   publishes pre-releases from any branch, official versions only from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# Never run two publishes at once, and never cancel one that is in progress.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Same checks as pull requests (tests, pre-commit, pip-audit) on the exact commit to publish.
  ci:
    uses: ./.github/workflows/ci.yml

  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
      is_official: ${{ steps.check.outputs.is_official }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read the version from pyproject.toml, skip if its tag already exists, and decide
      # whether this event is allowed to publish this kind of version.
      - name: Check version
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Official versions are x.y.z (optionally .postN); anything else is a pre-release
          if echo "$VERSION" | grep -qP '^\d+\.\d+\.\d+(\.post\d+)?$'; then
            IS_OFFICIAL=true
          else
            IS_OFFICIAL=false
          fi
          echo "is_official=${IS_OFFICIAL}" >> "$GITHUB_OUTPUT"

          SHOULD_PUBLISH=true
          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists, skipping publish"
            SHOULD_PUBLISH=false
          elif [ "$IS_OFFICIAL" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "Official version $VERSION can only be published from main, skipping"
            SHOULD_PUBLISH=false
          elif [ "$IS_OFFICIAL" = "false" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Pre-release $VERSION is only published by a manual workflow_dispatch run, skipping"
            SHOULD_PUBLISH=false
          else
            echo "Will publish $VERSION (official=${IS_OFFICIAL})"
          fi
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

  # Build without any write permission; the publish job only receives the artifacts.
  build:
    needs: [ci, check-version]
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted publishing (OIDC, no stored token). The action also generates and uploads
  # PEP 740 provenance attestations for every distribution.
  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fastapi-task-manager/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Tag and GitHub Release only after PyPI accepted the upload.
  release:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # gh creates the tag on the published commit, so no checkout or git push is needed.
      - name: Create git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          IS_OFFICIAL: ${{ needs.check-version.outputs.is_official }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_OFFICIAL" != "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            $PRERELEASE_FLAG
