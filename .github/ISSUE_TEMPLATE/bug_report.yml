name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the form below to help us investigate.

        Before opening the issue, check the [Known Issues](https://fastapi-task-manager.morry98.com/known-issues.html) page.
        **Do not report security vulnerabilities here**: follow the [Security Policy](https://github.com/Morry98/fastapi-task-manager/blob/main/SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Configure TaskManager with ...
        2. Register a task with cron expression ...
        3. Start the application
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or logs if available.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, ideally with the `fastapi.task-manager` loggers at DEBUG or INFO level. Remove secrets before pasting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The `Config` you pass to `TaskManager` (remove passwords) and any per-group or per-task overrides involved.
      render: python
    validations:
      required: false

  - type: input
    id: deployment
    attributes:
      label: Deployment
      description: Number of app instances and uvicorn workers sharing the same Redis.
      placeholder: "2 containers x 4 uvicorn workers"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Package Version
      description: "Output of: pip show fastapi-task-manager"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: "Output of: python --version"
      placeholder: "3.14.0"
    validations:
      required: true

  - type: input
    id: redis-py-version
    attributes:
      label: redis-py Version
      description: "Output of: pip show redis"
      placeholder: "7.4.0"
    validations:
      required: true

  - type: input
    id: redis-version
    attributes:
      label: Redis Server Version
      description: "Output of: redis-server --version"
      placeholder: "7.2.0"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs that might help.
    validations:
      required: false
